name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -f docker/Dockerfile --build-arg APP_VERSION=${{ github.sha }} -t alivocab:ci .
      - name: Start it and check health
        run: |
          docker run -d --name alivocab -p 3180:3180 \
            -e APP_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 24)" \
            -e BETTER_AUTH_URL=http://localhost:3180 \
            alivocab:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3180/api/health && exit 0
            sleep 1
          done
          docker logs alivocab
          exit 1
      - name: Serves the web app
        run: curl -fsS http://localhost:3180/ | grep -q '<div id="root">'
